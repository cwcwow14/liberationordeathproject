[build]
  command = "vite build"
  publish = "dist/client"
[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

# Markdown-for-agents edge function. Registered only on the public content pages —
# the pages that hold real prose. Utility routes (/login), server function endpoints
# and static assets are intentionally left off this list.
# See netlify/edge-functions/markdown.ts for how to add or remove paths.
[[edge_functions]]
  function = "markdown"
  path = "/"

[[edge_functions]]
  function = "markdown"
  path = "/photos"

[[edge_functions]]
  function = "markdown"
  path = "/join"

# Security headers — force every visitor onto HTTPS and harden the site.
# Strict-Transport-Security tells browsers to only ever connect over HTTPS,
# which clears the "Not secure" state on subsequent visits. The CSP
# upgrade-insecure-requests directive auto-upgrades any http subresource to
# https as a safety net against mixed-content warnings.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
