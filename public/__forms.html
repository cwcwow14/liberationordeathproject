<!-- Static skeletons for Netlify Forms build-time detection — not rendered to users -->
<html>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <textarea name="message"></textarea>
    </form>
    <form name="updates" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="updates" />
      <input name="bot-field" />
      <input name="email" />
    </form>
  </body>
</html>
